<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}meghRoots | Pure Flavours from Meghalaya{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        turmeric: '#E1A31A', forest: '#2F5233', cream: '#FBF6EA', bark: '#4A3B2A'
      }}}
    }
  </script>
</head>
<body class="bg-cream text-bark min-h-screen flex flex-col">
  <header class="bg-forest text-cream">
    <nav class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="{% url 'home' %}" class="text-2xl font-bold tracking-tight">
        megh<span class="text-turmeric">Roots</span>
      </a>
      <div class="flex gap-6 text-sm items-center">
        <a href="{% url 'home' %}" class="hover:text-turmeric">Home</a>
        <a href="{% url 'catalog:product_list' %}" class="hover:text-turmeric">Shop</a>
        <a href="{% url 'about' %}" class="hover:text-turmeric">Our Story</a>
        <a href="{% url 'contact' %}" class="hover:text-turmeric">Contact</a>
        <a href="{% url 'cart:detail' %}" class="bg-turmeric text-bark font-semibold px-4 py-1.5 rounded-full">
          Cart ({{ cart|length }})
        </a>
      </div>
    </nav>
  </header>

  <main class="flex-1">
    {% if messages %}
      <div class="max-w-6xl mx-auto px-4 mt-4">
        {% for message in messages %}
          <div class="rounded-lg px-4 py-3 mb-2 text-sm {% if message.tags == 'error' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-forest text-cream text-center text-sm py-6 mt-12">
    <p>&copy; meghRoots. Grown in the hills of Meghalaya, delivered across India.</p>
  </footer>
</body>
</html>
